<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bốc thăm thi đấu thể thao</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ff;--card:#fff;--tx:#1c1840;--mut:#6b6794;--bd:#e0dcf5;--p1:#ff3d71;--p2:#7b2ff7;--p3:#00c2ff;--nam:#0a84ff;--nu:#ff2d92;--ok:#12b76a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#120f2a;--card:#1d1942;--tx:#f2f0ff;--mut:#a9a4d6;--bd:#34306a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#120f2a;--card:#1d1942;--tx:#f2f0ff;--mut:#a9a4d6;--bd:#34306a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Be Vietnam Pro","Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(120deg,var(--p1),var(--p2) 55%,var(--p3));color:#fff;padding:28px 16px 34px;text-align:center}
header h1{margin:0;font-size:clamp(1.5rem,5vw,2.4rem);letter-spacing:.5px;text-shadow:0 2px 12px #0004}
header p{margin:6px 0 0;opacity:.92}
main{flex:1;width:100%;max-width:1100px;margin:-20px auto 0;padding:0 14px 30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:0 10px 30px #7b2ff726;margin-bottom:16px}
label{display:block;font-weight:700;margin:0 0 6px;font-size:.92rem}
input[type=text],textarea{width:100%;padding:11px 13px;border:2px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--p2)}
textarea{min-height:150px;resize:vertical}
.types{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.types button{flex:1 1 130px;padding:11px 8px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}
.types button.on{background:linear-gradient(120deg,var(--p1),var(--p2));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.hint{color:var(--mut);font-size:.82rem;margin-top:4px}
.btn{border:0;border-radius:14px;padding:13px 22px;font:inherit;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--p1),var(--p2));box-shadow:0 6px 18px #ff3d7155}
.btn.alt{background:var(--bg);color:var(--tx);border:2px solid var(--bd);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.err{color:var(--p1);font-weight:700}
h2{margin:0 0 10px;font-size:1.3rem}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;color:#fff;font-size:.8rem;font-weight:700;background:var(--p2)}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:10px 0}
.pair{padding:9px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);font-weight:600}
.pair b{color:var(--nam)}.pair i{color:var(--nu);font-style:normal;font-weight:700}
.bracket{display:flex;gap:22px;overflow-x:auto;padding:6px 2px 14px}
.round{min-width:220px;display:flex;flex-direction:column;justify-content:space-around;gap:14px}
.round h3{margin:0;text-align:center;font-size:.95rem;color:var(--p2)}
.match{border:2px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--bg)}
.slot{padding:10px 12px;cursor:pointer;font-weight:600;border-bottom:1px solid var(--bd);min-height:42px;display:flex;align-items:center;gap:6px}
.slot:last-child{border-bottom:0}
.slot:hover{background:#7b2ff71f}
.slot.win{background:linear-gradient(120deg,#12b76a,#00c2ff);color:#fff}
.slot.empty{color:var(--mut);cursor:default;font-weight:400;font-style:italic}
.slot.bye{color:var(--p1);cursor:default}
.champ{text-align:center;margin-top:8px;padding:16px;border-radius:16px;background:linear-gradient(120deg,#ffb800,#ff3d71);color:#fff;font-size:1.3rem;font-weight:800}
footer{text-align:center;padding:18px 12px;background:linear-gradient(120deg,var(--p2),#3a1d9c);color:#fff;font-weight:600;font-size:.92rem}
.spin{animation:sp .15s linear infinite}
@keyframes sp{50%{opacity:.4}}
@media print{header .hint,.types,.btn,#form{display:none}}
</style>
</head>
<body>
<header>
  <h1>🏆 BỐC THĂM THI ĐẤU THỂ THAO</h1>
  <p>Nhập môn thi – chọn nội dung – bốc thăm ngẫu nhiên – ghi nhận kết quả</p>
</header>
<main>
<section class="card" id="form">
  <label for="sport">Tên môn thi đấu</label>
  <input type="text" id="sport" placeholder="Ví dụ: Cầu lông, Bóng bàn, Cờ vua...">
  <label style="margin-top:14px">Loại hình thi đấu</label>
  <div class="types" id="types"></div>
  <div class="grid" id="inputs"></div>
  <div class="row">
    <button class="btn" id="draw">🎲 BỐC THĂM</button>
    <button class="btn alt" id="sample">Điền mẫu</button>
    <button class="btn alt" id="reset">Xóa hết</button>
    <span class="err" id="err"></span>
  </div>
</section>
<section id="result"></section>
</main>
<footer>Sản phẩm tạo bởi Cô Nguyễn Thị Minh Thanh - THPT Võ Thị Sáu - Phường Gia Định - TP.Hồ Chí Minh</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const TYPES={
  dn:{n:"Đơn nam",g:"m",t:"single"},
  dnu:{n:"Đơn nữ",g:"f",t:"single"},
  den:{n:"Đôi nam",g:"m",t:"pair"},
  denu:{n:"Đôi nữ",g:"f",t:"pair"},
  dnn:{n:"Đôi nam nữ",g:"x",t:"mixed"}
};
let cur="dn",rounds=[],pairsList=[];
const $=id=>document.getElementById(id);
const lines=s=>s.split(/\n/).map(x=>x.trim()).filter(Boolean);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function renderTypes(){
  $("types").innerHTML=Object.entries(TYPES).map(([k,v])=>`<button data-k="${k}" class="${k===cur?'on':''}">${v.n}</button>`).join("");
  $("types").querySelectorAll("button").forEach(b=>b.onclick=()=>{cur=b.dataset.k;renderTypes();renderInputs()});
}
function renderInputs(){
  const t=TYPES[cur];let h="";
  if(t.t==="single")h=`<div><label>${t.g==="m"?"♂ Danh sách VĐV NAM":"♀ Danh sách VĐV NỮ"}</label><textarea id="a" placeholder="Mỗi dòng một tên"></textarea><div class="hint">Mỗi dòng một vận động viên.</div></div>`;
  if(t.t==="pair")h=`<div><label>${t.g==="m"?"♂ Các cặp NAM":"♀ Các cặp NỮ"} (cặp cố định)</label><textarea id="a" placeholder="Nguyễn An & Trần Bình\nLê Cường & Phạm Dũng"></textarea><div class="hint">Mỗi dòng một cặp, ngăn cách bằng dấu &amp; hoặc /</div></div>`;
  if(t.t==="mixed")h=`<div><label>♂ Danh sách VĐV NAM</label><textarea id="a" placeholder="Mỗi dòng một tên nam"></textarea></div><div><label>♀ Danh sách VĐV NỮ</label><textarea id="b" placeholder="Mỗi dòng một tên nữ"></textarea></div><div class="hint">Hệ thống sẽ bốc thăm ngẫu nhiên ghép mỗi nam với một nữ thành cặp cố định.</div>`;
  $("inputs").innerHTML=h;$("err").textContent="";
}
const SAMPLE={
  dn:["Nguyễn Văn An","Trần Quốc Bảo","Lê Minh Cường","Phạm Đức Dũng","Võ Hoàng Em"],
  dnu:["Nguyễn Thị Hoa","Trần Ngọc Lan","Lê Thu Mai","Phạm Bích Ngọc","Võ Thanh Thảo","Đặng Kim Yến"],
  den:["An & Bảo","Cường & Dũng","Em & Phúc","Giang & Hải"],
  denu:["Hoa & Lan","Mai & Ngọc","Thảo & Yến"],
  dnn:[["An","Bảo","Cường","Dũng"],["Hoa","Lan","Mai","Ngọc"]]
};
$("sample").onclick=()=>{
  if(!$("sport").value)$("sport").value="Cầu lông";
  const s=SAMPLE[cur];
  if(cur==="dnn"){$("a").value=s[0].join("\n");$("b").value=s[1].join("\n")}else $("a").value=s.join("\n");
};
$("reset").onclick=()=>{$("sport").value="";renderInputs();$("result").innerHTML="";rounds=[]};

function build(entries){
  rounds=[entries.map(n=>n)];
  while(rounds[rounds.length-1].length>1){
    const n=rounds[rounds.length-1].length,next=Array(Math.ceil(n/2)).fill(null);
    if(n%2===1)next[next.length-1]=rounds[rounds.length-1][n-1]; // đặc cách
    rounds.push(next);
  }
}
function pick(r,i){
  const nm=rounds[r][i];if(!nm||r>=rounds.length-1)return;
  const n=rounds[r].length;if(n%2===1&&i===n-1)return;
  const ni=Math.floor(i/2);
  if(rounds[r+1][ni]===nm)return;
  rounds[r+1][ni]=nm;
  for(let k=r+2;k<rounds.length;k++){rounds[k]=rounds[k].map(()=>null);} // xoá các vòng sau
  // giữ lại người được đặc cách ở vòng sau
  for(let k=r+1;k<rounds.length-1;k++){const n2=rounds[k].length;if(n2%2===1&&k>r+1&&false){}}
  for(let k=r+1;k<rounds.length-1;k++){const n2=rounds[k].length;if(n2%2===1)rounds[k+1][rounds[k+1].length-1]=rounds[k][n2-1];}
  show();
}
function label(nm){
  const t=TYPES[cur];
  if(t.t==="single")return (t.g==="m"?"♂ ":"♀ ")+esc(nm);
  return esc(nm);
}
function show(){
  const t=TYPES[cur],sport=esc($("sport").value.trim()||"Môn thi đấu");
  let h=`<div class="card"><h2>${sport} <span class="tag">${t.n}</span></h2>`;
  if(pairsList.length){
    h+=`<b>Kết quả bốc thăm ghép cặp:</b><div class="pairs">`+pairsList.map((p,i)=>`<div class="pair">${i+1}. ${p}</div>`).join("")+`</div>`;
  }
  h+=`<div class="hint">Nhấn vào tên VĐV/cặp thắng để đưa vào vòng sau.</div><div class="bracket">`;
  const R=rounds.length;
  rounds.forEach((rd,r)=>{
    const nm=r===R-1?"Chung kết ➜ Vô địch":r===R-2&&R>2?"Chung kết":r===R-3&&R>3?"Bán kết":"Vòng "+(r+1);
    h+=`<div class="round"><h3>${r===R-1?"🏅 Vô địch":(r===R-2?"Chung kết":(r===R-3?"Bán kết":"Vòng "+(r+1)))}</h3>`;
    if(r===R-1){h+=`<div class="match"><div class="slot ${rd[0]?'win':'empty'}">${rd[0]?label(rd[0]):"Chưa xác định"}</div></div></div>`;return}
    for(let i=0;i<rd.length;i+=2){
      const a=rd[i],b=rd[i+1],nx=rounds[r+1][Math.floor(i/2)];
      const cell=(v,idx)=>v==null?`<div class="slot empty">Chờ kết quả</div>`:`<div class="slot ${nx===v?'win':''}" onclick="pick(${r},${idx})">${label(v)}</div>`;
      h+=`<div class="match">${cell(a,i)}${b===undefined?`<div class="slot bye">⏭ Đặc cách vào vòng sau</div>`:cell(b,i+1)}</div>`;
    }
    h+=`</div>`;
  });
  h+=`</div>`;
  const champ=rounds[R-1][0];
  if(champ&&R>1)h+=`<div class="champ">🥇 ${label(champ)}</div>`;
  h+=`<div class="row"><button class="btn" onclick="drawNow()">🔁 Bốc thăm lại</button><button class="btn alt" onclick="exportDoc()">📄 Xuất file Word</button><button class="btn alt" onclick="window.print()">🖨 In lịch thi đấu</button></div></div>`;
  $("result").innerHTML=h;
}
function collect(){
  const t=TYPES[cur],a=lines($("a").value);
  pairsList=[];
  if(t.t==="single"){
    if(a.length<2)throw "Cần ít nhất 2 vận động viên.";
    return shuffle(a);
  }
  if(t.t==="pair"){
    const ps=a.map(l=>l.split(/\s*(?:&|\/|\+|\s-\s|–)\s*/).filter(Boolean).join(" & "));
    if(ps.length<2)throw "Cần ít nhất 2 cặp.";
    return shuffle(ps);
  }
  const b=lines($("b").value),m=shuffle(a),f=shuffle(b),k=Math.min(m.length,f.length);
  if(k<2)throw "Cần ít nhất 2 nam và 2 nữ để tạo 2 cặp.";
  const ps=[];
  for(let i=0;i<k;i++){ps.push(m[i]+" & "+f[i]);pairsList.push(`<b>♂ ${esc(m[i])}</b> + <i>♀ ${esc(f[i])}</i>`)}
  let w=m.length!==f.length?`Lưu ý: số nam (${m.length}) khác số nữ (${f.length}); ${Math.abs(m.length-f.length)} VĐV không có cặp.`:"";
  if(w)pairsList.push(`<span class="err">${w}</span>`);
  return ps;
}
function drawNow(){
  $("err").textContent="";
  let e;try{e=collect()}catch(x){$("err").textContent=x;return}
  const btn=$("draw");btn.classList.add("spin");
  let c=0;const iv=setInterval(()=>{
    const s=shuffle(e);$("result").innerHTML=`<div class="card"><h2 class="spin">🎲 Đang bốc thăm...</h2><div class="pairs">`+s.slice(0,12).map(x=>`<div class="pair">${esc(x)}</div>`).join("")+`</div></div>`;
    if(++c>8){clearInterval(iv);btn.classList.remove("spin");build(e);show();$("result").scrollIntoView({behavior:"smooth"})}
  },110);
}
$("draw").onclick=drawNow;
const X=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const P=(t,o={})=>`<w:p><w:pPr>${o.c?'<w:jc w:val="center"/>':''}<w:spacing w:after="120"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>${o.b?'<w:b/>':''}${o.i?'<w:i/>':''}${o.col?`<w:color w:val="${o.col}"/>`:''}<w:sz w:val="${o.s||24}"/></w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r></w:p>`;
const TC=(t,w,h)=>`<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${h?'<w:shd w:val="clear" w:color="auto" w:fill="E6DFFF"/>':''}</w:tcPr>${P(t,{b:h,s:22})}</w:tc>`;
const TBL=(rows,ws)=>`<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(k=>`<w:${k} w:val="single" w:sz="4" w:color="999999"/>`).join("")}</w:tblBorders></w:tblPr>${rows.map((r,i)=>`<w:tr>${r.map((c,j)=>TC(c,ws[j],i===0)).join("")}</w:tr>`).join("")}</w:tbl>`;
async function exportDoc(){
  if(!rounds.length)return;
  const dl=window.claude?await claude.use("downloads"):null;
  if(!dl){alert("Chế độ xem hiện tại không hỗ trợ tải file. Hãy mở trang trong claude.ai.");return}
  const t=TYPES[cur],sport=$("sport").value.trim()||"Môn thi đấu",R=rounds.length,dash="........................";
  let b=P("LỊCH THI ĐẤU",{b:1,c:1,s:36,col:"7B2FF7"})+P(sport.toUpperCase()+" - "+t.n.toUpperCase(),{b:1,c:1,s:28})+P("Ngày xuất: "+new Date().toLocaleDateString("vi-VN"),{c:1,i:1,s:20});
  if(pairsList.length){
    b+=P("Kết quả bốc thăm ghép cặp",{b:1,s:26});
    const f=pairsList.filter(x=>!x.includes("err")).map(x=>x.replace(/<[^>]+>/g,"").replace(/♂|♀/g,"").replace(" + "," & ").trim());
    b+=TBL([["STT","Cặp thi đấu (Nam & Nữ)"],...f.map((x,i)=>[String(i+1),x])],[900,8000])+P("");
  }
  rounds.forEach((rd,r)=>{
    if(r===R-1)return;
    const nm=r===R-2?"Chung kết":r===R-3?"Bán kết":"Vòng "+(r+1);
    const rows=[["Trận","VĐV / Cặp A","VĐV / Cặp B","Kết quả"]];
    for(let i=0;i<rd.length;i+=2){
      rows.push([String(i/2+1),rd[i]||dash,rd[i+1]===undefined?"(Đặc cách vào vòng sau)":(rd[i+1]||dash),""]);
    }
    b+=P(nm,{b:1,s:26,col:"FF3D71"})+TBL(rows,[800,3000,3000,2100])+P("");
  });
  const champ=rounds[R-1][0];
  b+=P("VÔ ĐỊCH: "+(champ||dash),{b:1,c:1,s:28,col:"C2410C"})+P("");
  b+=P("Sản phẩm tạo bởi Cô Nguyễn Thị Minh Thanh - THPT Võ Thị Sáu - Phường Gia Định - TP.Hồ Chí Minh",{c:1,i:1,s:20});
  const W='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const zip=new JSZip();
  zip.file("[Content_Types].xml",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file("_rels/.rels",'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${W}><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`);
  const slug=sport.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")||"mon-thi";
  try{
    const blob=await zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
    await dl.save({filename:"Lich-thi-dau-"+slug+"-"+t.n.replace(/\s/g,"-").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d")+".docx",data:blob});
  }catch(e){if(!e||e.code!=="declined")alert("Không tải được file: "+((e&&e.message)||e))}
}
renderTypes();renderInputs();
</script>
</body>
</html>
